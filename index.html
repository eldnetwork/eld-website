    <link rel="canonical" href="https://www.eld.network/" />
    <meta
      name="description"
      content="Eld is a decentralized protocol for ephemeral, content-addressed storage. Set a TTL, verify data while it is live, and let it expire."
    />
    <meta name="theme-color" content="#000000" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('eld-home-theme');
          var light =
            stored === 'light' ||
            (stored !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) {
            document.documentElement.classList.add('eld-theme-light');
          }
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', light ? '#eff3f8' : '#000000');
          }
        } catch (_) {}
      })();
    </script>
