<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://www.eld.network/" />
    <meta
      name="description"
      content="Eld is a decentralized ephemeral storage protocol. Earn ELD tokens by providing storage, share content-addressed files with automatic TTL expiry, and build decentralized apps. Testnet live 2026."
    />
    <meta name="theme-color" content="#000000" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('eld-home-theme')
          var light =
            stored === 'light' ||
            (stored !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)
          if (light) {
            document.documentElement.classList.add('eld-theme-light')
          }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute('content', light ? '#eff3f8' : '#000000')
          }
        } catch (_) {}
      })()
    </script>
